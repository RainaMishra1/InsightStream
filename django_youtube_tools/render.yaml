services:
  # Django Web Service
  - type: web
    name: django-youtube-tools
    env: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --timeout 120 --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-tools-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: youtube-tools-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: youtube-tools-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: youtube-tools-redis
          property: connectionString
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

  # Celery Worker
  - type: worker
    name: celery-worker
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.10
      - key: SECRET_KEY
        fromService:
          type: web
          name: django-youtube-tools
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-tools-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: youtube-tools-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: youtube-tools-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: youtube-tools-redis
          property: connectionString
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: youtube-tools-db
    databaseName: youtube_tools
    user: youtube_tools_user
    region: oregon

  - name: youtube-tools-redis
    type: redis
    region: oregon
    maxmemoryPolicy: allkeys-lru
