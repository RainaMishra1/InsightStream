<!-- Sidebar Component -->
<aside class="w-64 bg-white border-r border-gray-200 min-h-screen" x-data="{ mobileMenuOpen: false }">
    <!-- Mobile Menu Toggle -->
    <div class="md:hidden p-4 border-b border-gray-200">
        <button 
            @click="mobileMenuOpen = !mobileMenuOpen"
            class="w-full flex items-center justify-between text-gray-700 hover:text-primary"
        >
            <span class="font-medium">Menu</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>
    
    <!-- Navigation Links -->
    <nav class="p-4 space-y-2" :class="{ 'hidden md:block': !mobileMenuOpen }">
        <!-- Dashboard -->
        <a href="{% url 'dashboard' %}" 
           class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'dashboard' %}bg-primary text-white{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span class="font-medium">Dashboard</span>
        </a>
        
        <!-- Divider -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                AI Tools
            </p>
        </div>
        
        <!-- Thumbnail Generator -->
        <a href="{% url 'thumbnails:generator' %}" 
           class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'generator' and request.resolver_match.namespace == 'thumbnails' %}bg-primary text-white{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <span class="font-medium">Thumbnail Generator</span>
        </a>
        
        <!-- Thumbnail Search -->
        <a href="{% url 'thumbnails:search' %}" 
           class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'search' and request.resolver_match.namespace == 'thumbnails' %}bg-primary text-white{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span class="font-medium">Thumbnail Search</span>
        </a>
        
        <!-- Keyword Research -->
        <a href="{% url 'keywords:research' %}" 
           class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.namespace == 'keywords' %}bg-primary text-white{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
            </svg>
            <span class="font-medium">Keyword Research</span>
        </a>
        
        <!-- Content Generator -->
        <a href="{% url 'content:generator' %}" 
           class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.namespace == 'content' %}bg-primary text-white{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            <span class="font-medium">Content Generator</span>
        </a>
        
        <!-- Divider -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                Resources
            </p>
        </div>
        
        <!-- Help & Documentation -->
        <a href="#" 
           class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span class="font-medium">Help</span>
        </a>
    </nav>
    
    <!-- Footer Info -->
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-200 bg-gray-50">
        <div class="text-xs text-gray-500 text-center">
            <p class="font-medium">YouTube Tools v1.0</p>
            <p class="mt-1">Django Migration</p>
        </div>
    </div>
</aside>
