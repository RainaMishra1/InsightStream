<!-- Header Component -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50" x-data="{ userMenuOpen: false }">
    <div class="px-6 py-4">
        <div class="flex items-center justify-between">
            <!-- Logo and Brand -->
            <div class="flex items-center space-x-4">
                <a href="{% url 'dashboard' %}" class="flex items-center space-x-2">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-xl font-bold text-gray-900">YouTube Tools</span>
                </a>
            </div>
            
            <!-- Navigation Menu -->
            <nav class="hidden md:flex items-center space-x-6">
                <a href="{% url 'thumbnails:generator' %}" class="text-gray-600 hover:text-primary transition-colors">
                    Thumbnail Generator
                </a>
                <a href="{% url 'thumbnails:search' %}" class="text-gray-600 hover:text-primary transition-colors">
                    Thumbnail Search
                </a>
                <a href="{% url 'keywords:research' %}" class="text-gray-600 hover:text-primary transition-colors">
                    Keyword Research
                </a>
                <a href="{% url 'content:generator' %}" class="text-gray-600 hover:text-primary transition-colors">
                    Content Generator
                </a>
            </nav>
            
            <!-- User Profile Dropdown -->
            <div class="relative">
                <button 
                    @click="userMenuOpen = !userMenuOpen"
                    @click.away="userMenuOpen = false"
                    class="flex items-center space-x-2 text-gray-700 hover:text-primary transition-colors focus:outline-none"
                >
                    <div class="w-8 h-8 bg-primary text-white rounded-full flex items-center justify-center font-semibold">
                        {{ user.email.0|upper }}
                    </div>
                    <span class="hidden md:block">{{ user.email }}</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                
                <!-- Dropdown Menu -->
                <div 
                    x-show="userMenuOpen"
                    x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="transform opacity-0 scale-95"
                    x-transition:enter-end="transform opacity-100 scale-100"
                    x-transition:leave="transition ease-in duration-75"
                    x-transition:leave-start="transform opacity-100 scale-100"
                    x-transition:leave-end="transform opacity-0 scale-95"
                    class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-1 border border-gray-200"
                    style="display: none;"
                >
                    <div class="px-4 py-2 border-b border-gray-200">
                        <p class="text-sm font-medium text-gray-900">{{ user.username }}</p>
                        <p class="text-xs text-gray-500 truncate">{{ user.email }}</p>
                    </div>
                    
                    <a href="{% url 'dashboard' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                        <div class="flex items-center space-x-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                            </svg>
                            <span>Dashboard</span>
                        </div>
                    </a>
                    
                    <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                        <div class="flex items-center space-x-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                            <span>Logout</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>
